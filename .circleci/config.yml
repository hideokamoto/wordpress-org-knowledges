version: 2.1

jobs:
  plugin-checks:
    docker:
      - image: cimg/node:22.23.5
    steps:
      - checkout
      - run:
          name: Install MCP server dependencies
          working_directory: packages/mcp-wordpress-docs
          command: npm ci
      - run:
          name: Type-check MCP server
          working_directory: packages/mcp-wordpress-docs
          command: npm run typecheck
      - run:
          name: Install plugin dependencies the way Claude Code does
          command: npm ci --omit=dev --ignore-scripts
      - run:
          name: Validate Claude plugin manifest
          command: npx -y @anthropic-ai/claude-code@2.1.332 plugin validate .
      - run:
          name: Verify plugin MCP server
          # Remove the package's own node_modules so the server resolves its
          # dependencies from the plugin root, as it does once installed.
          command: |
            rm -rf packages/mcp-wordpress-docs/node_modules
            npm run verify:plugin -- --live

workflows:
  plugin:
    jobs:
      - plugin-checks
